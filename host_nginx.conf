# ── Upstreams ──────────────────────────────────────────────────────
upstream caddy_public {
    server 127.0.0.1:8087;
    keepalive 32;
}

upstream caddy_admin {
    server 127.0.0.1:9000;
    keepalive 32;
}


# ── WebSocket upgrade map ──────────────────────────────────────────
# Required so Connection: upgrade flows through nginx untouched.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ── Brute-force cap for the admin login endpoint ───────────────────
# 10 requests/minute per client IP, with a small burst.
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;




# ─────────────────────────────────────────────────────────────────────
# 1. HTTP → HTTPS redirect (both vhosts share this)
# ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
      server_name echoriftsounds.com;

    # Allow Let's Encrypt webroot challenges to pass through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ─────────────────────────────────────────────────────────────────────
# 2. Public HTTPS vhost  →  Caddy public listener (:8087)
# ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name echoriftsounds.com;

    # ── TLS ──────────────────────────────────────────────────────
    # All non-cert SSL directives (protocols, ciphers, session cache,
    # stapling, tickets) are inherited from /etc/nginx/nginx.conf.
    # nginx ≥1.25 errors out on per-vhost redefinition. Only the cert
    # paths are vhost-specific.
    ssl_certificate     /etc/letsencrypt/live/echorift.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echorift.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/echorift.example.com/chain.pem;

    # ── Security headers ─────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header X-Frame-Options           "DENY" always;

    # The audio library has no upload endpoint, so keep this small.
    client_max_body_size 1m;

    # ── Proxy defaults ───────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    proxy_set_header   X-Internal-Listener "";
    proxy_redirect     off;


    location /music/ {
        proxy_pass         http://caddy_public;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Plain Range/keep-alive — never WebSocket-style upgrade.
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Everything else ──────────────────────────────────────────
    location / {
        proxy_pass http://caddy_public;
    }
}



server {
    listen 9443 ssl http2;
    server_name echoriftsounds.com;



    # ── TLS ──────────────────────────────────────────────────────
    # Inherits all non-cert SSL settings from /etc/nginx/nginx.conf.
    # See public vhost note above.
    ssl_certificate     /etc/nginx/admin-selfsigned.crt;
    ssl_certificate_key /etc/nginx/admin-selfsigned.key;
 
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;
    add_header X-Frame-Options        "DENY" always;

    # ── IP allowlist ─────────────────────────────────────────────
    # Second fence after the host firewall. Mirror ADMIN_IPS in .env.
    allow 192.168.10.20;
    allow 192.168.10.12;
    allow 100.75.159.118;       # Tailscale
    deny  all;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # $scheme is 'https' here — req.secure flips true in Express, so the
    # API issues session cookies with the Secure flag set.
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    # Strip the Caddy-only trust marker so it can never be spoofed
    # by an external client. Caddy's internal listener is the sole
    # legitimate source of this header.
    proxy_set_header   X-Internal-Listener "";
    proxy_redirect     off;

    # Cap brute force at the perimeter.
    location = /api/admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://caddy_admin;
    }

    location / {
        proxy_pass http://caddy_admin;
    }
}
