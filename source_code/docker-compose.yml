services:
  echoriftsounds:
    build:
      context: .
      dockerfile: Dockerfile
    image: echoriftsounds:latest
    container_name: echoriftsounds-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - TZ=Europe/London
    volumes:
      # Mount your music directory
      - yourMusicDir:/app/music:ro
    networks:
      - echoriftsounds-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
networks:
  echoriftsounds-network:
    name: echoriftsounds-network
    driver: bridge

