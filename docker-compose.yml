services:
  # One-shot init: a freshly-created named volume is owned by root:root, which
  # would block the api container (uid 1000) from writing JSON state. This
  # chowns it to 1000:1000 once and exits. Idempotent — safe to run on every
  # `up`. network_mode: none keeps it out of the auto-created default network.
  data-init:
    image: alpine:3
    container_name: echorift-data-init
    user: "0:0"
    network_mode: "none"
    command: >
      sh -c "
        mkdir -p /data/peaks &&
        chown -R 1000:1000 /data &&
        chmod 755 /data /data/peaks
      "
    volumes:
      - echorift-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    image: echorift-api:latest
    container_name: echorift-api
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully

    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Nicosia
    volumes:
      - echorift-data:/app/data
      - "/mnt/disk_0/MyFatNas/Music/Armin van buuren/Asot/my mix:/app/music:ro"
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # Pi 4 has 4 cores; let ffmpeg use more of them during peak generation.
          # 256M was tight while streaming long FLACs through Node — 512M gives V8 GC headroom.
          cpus: '2.5'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
      args:
        API_INTERNAL_URL: http://api:3001
    image: echorift-web:latest
    container_name: echorift-web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    environment:
      TZ: Europe/Nicosia
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  caddy:
    image: caddy:2.8-alpine
    container_name: echorift-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      TZ: Europe/Nicosia
    ports:
     
      - "127.0.0.1:8087:8080"
     
      - "127.0.0.1:9000:9000"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

networks:
  echoriftsounds-network:
    name: echoriftsounds-network
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  echorift-data:
    name: echorift-data
