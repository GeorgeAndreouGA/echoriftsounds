services:
  data-init:
    image: alpine:3
    container_name: echorift-data-init
    user: "0:0"
    network_mode: "none"
    command: >
      sh -c "
        mkdir -p /data/peaks /data/stream &&
        chown -R 1000:1000 /data &&
        find /data -type d -exec chmod 700 {} + &&
        find /data -type f -exec chmod 600 {} +
      "
    volumes:
      - echorift-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    image: echorift-api:latest
    container_name: echorift-api
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully

    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Nicosia
    volumes:
      - echorift-data:/app/data
      - "/home/george:/app/music:ro"
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
      args:
        API_INTERNAL_URL: http://api:3001
        BASE_PATH: ${BASE_PATH:-}
    image: echorift-web:latest
    container_name: echorift-web
    restart: unless-stopped
    depends_on:
      - api
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Europe/Nicosia
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  caddy:
    image: caddy:2.8-alpine
    container_name: echorift-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      TZ: Europe/Nicosia
      BASE_PATH: ${BASE_PATH:-}
    ports:
      # Single port now serves public + admin; nginx fronts this on :8087.
      - "127.0.0.1:8087:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - echoriftsounds-network
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

networks:
  echoriftsounds-network:
    name: echoriftsounds-network
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  echorift-data:
    name: echorift-data
